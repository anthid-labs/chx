[package]
name = "chx-core"
description = "ClickHouse for Rust: compile-time checked queries, RowBinary rows, bulk inserts, and schema migrations with checksummed, resumable history."
keywords = ["clickhouse", "migrations", "database", "schema", "sql"]
categories = ["database", "development-tools"]
readme = "README.md"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
rust-version.workspace = true

[lib]
name = "chx"
path = "src/lib.rs"

[features]
default = ["macros", "chrono", "uuid"]
# `query!` and friends, and `#[derive(FromRow)]`.
macros = ["dep:chx-macros"]
# Column types. Each feature turns on the codec here and the matching column
# mapping in the macros, so a build without one refuses the column at compile
# time instead of at run time.
chrono = ["dep:chrono", "chx-macros?/chrono"]
uuid = ["dep:uuid", "chx-macros?/uuid"]

[dependencies]
chx-types = { workspace = true }
chx-macros = { workspace = true, optional = true }
# The timer the lock polls with. The runtime itself is the caller's.
tokio = { workspace = true, features = ["time"] }
reqwest = { workspace = true }
url = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
chrono = { workspace = true, optional = true }
uuid = { workspace = true, optional = true }

[dev-dependencies]
# The live tests need a runtime, and join two runs to race them for the lock.
# `test-util` pauses the clock, so a run that waits on the lock is tested
# without waiting.
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "test-util"] }
tempfile = { workspace = true }
uuid = { workspace = true, features = ["v4"] }

# docs.rs builds with every feature, so each item shows up with the feature
# that gates it.
[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
