[package]
name = "chx-core"
description = "ClickHouse schema migrations: ordered SQL files, checksummed history, and resumable partial runs."
keywords = ["clickhouse", "migrations", "database", "schema", "sql"]
categories = ["database", "development-tools"]
readme = "README.md"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
rust-version.workspace = true

[lib]
name = "chx"
path = "src/lib.rs"

[dependencies]
# The timer the lock polls with. The runtime itself is the caller's.
tokio = { workspace = true, features = ["time"] }
reqwest = { workspace = true }
url = { workspace = true }
percent-encoding = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
# The live tests need a runtime, and join two runs to race them for the lock.
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tempfile = { workspace = true }
