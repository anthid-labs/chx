[workspace]
resolver = "3"

# Members are globbed: dropping a crate into apps/ or crates/ picks it up with
# no edit here. The glob's parent directory has to exist, since cargo treats an
# unmatched glob as a literal path and fails to read it.
members = [
    "apps/*",
    "crates/*",
]

[workspace.package]
version = "0.3.1"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/anthid-labs/chx"
homepage = "https://github.com/anthid-labs/chx"
authors = ["Dallin Wright <dallinwright@anthid.com>"]
# Stated rather than inferred, so a build on an older toolchain fails with the
# version it needs instead of an error inside a dependency. `cargo clippy`
# enforces the declared version, so it cannot drift below what the code uses.
rust-version = "1.88"

[profile.release]
opt-level = 3

[profile.dev]
opt-level = 0

[workspace.dependencies]
# Local crates. Add one line per crate created under crates/, then depend on
# it from an app with `<name> = { workspace = true }`.
#
# `version` alongside `path` is what makes publishing work: cargo builds against
# the path locally and rewrites the dependency to the version on crates.io when
# it packages. Keep it in step with `[workspace.package]` above on every bump.
#
# The library is `chx-core` because `chx` on crates.io is an unrelated hex
# editor. The command it builds is still `chx`.
#
# Three layers, because a proc-macro crate cannot depend on the crate that
# re-exports it: `chx-types` holds what the macros and the library must agree
# on (the type model, the parameter grammar, the cache file), `chx-macros`
# builds on that, and `chx-core` builds on both.
chx-types = { path = "crates/chx-types", version = "0.3.1" }
chx-macros = { path = "crates/chx-macros", version = "0.3.1" }
# No default features here, so the command pulls in only the migration engine;
# a user of the library gets them all unless they say otherwise.
chx-core = { path = "crates/chx-core", version = "0.3.1", default-features = false }

# Async runtime
# Features are chosen per crate: the library needs only a timer, and a runtime
# is the binary's decision.
tokio = { version = "1.53" }

# Proc macros. `syn` 2 rather than 3: the macros only parse a literal and a
# list of `name = expr` arguments, and 2 is what every toolchain in the
# declared range has already built.
syn = { version = "2", features = ["full"] }
quote = "1"
proc-macro2 = "1"

# The offline query cache, `.chx/query-<hash>.json`. The same shape as
# `.sqlx`, so a reader of one recognises the other.
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Column types. Optional on the library so a binary that only runs
# migrations pulls in neither.
uuid = { version = "1", default-features = false }

# ClickHouse, over its HTTP interface.
#
# Not a ClickHouse client crate. Every migration statement is opaque text, and
# the only rows chx reads are its own history, so a typed row mapper buys
# nothing. The HTTP interface is also the one every deployment exposes,
# including ClickHouse Cloud, which does not open the native port by default.
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
url = "2.5"
percent-encoding = "2.3"

# Checksums. SHA-256 rather than something faster, because the stored value
# should be checkable with `sha256sum migrations/<file>.sql` and nothing else.
sha2 = "0.11"

# CLI
clap = { version = "4.6", features = ["derive", "env"] }
# `.env` loading, the same crate and behaviour as sqlx-cli.
dotenvy = "0.15"

# Errors
thiserror = "2"

# Time
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }

# Telemetry
tracing = { version = "0.1", default-features = false, features = ["std", "attributes"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["registry", "env-filter", "std", "ansi"] }

# Test-only
tempfile = "3.27"
