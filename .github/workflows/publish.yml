name: "📦 Publish to crates.io"

# A release is a pushed tag: `git tag v0.1.0 && git push origin v0.1.0`.
# Bump `version` in the root Cargo.toml, and the `chx-core` line in
# [workspace.dependencies] with it, before tagging.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # A version number is burned on crates.io even if it is yanked a minute
    # later, so nothing publishes unless every check passed on this commit.
    needs: ci

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry + build
        uses: Swatinem/rust-cache@v2

      # `--workspace` publishes chx-core before chx-cli and waits for it to
      # reach the index, since the CLI resolves the library from crates.io.
      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --workspace --locked
