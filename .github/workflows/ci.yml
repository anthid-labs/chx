name: "✅ CI"

# No push trigger: the publish workflow runs this on every push to main.
on:
  pull_request:
  workflow_dispatch:
  # Called by the publish workflow, so a release runs exactly these checks.
  workflow_call:

permissions:
  contents: read

# Only a pull request is cancelled by a newer push. On main, a cancelled run
# is a release that never publishes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Every merge to main publishes, so every pull request carries a version
  # that has not been released yet.
  version:
    name: Version bumped
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml)
          pin=$(sed -n 's/^chx-core = .*version = "\(.*\)".*/\1/p' Cargo.toml)
          if [ "$pin" != "$version" ]; then
            echo "::error file=Cargo.toml::chx-core is pinned to $pin in [workspace.dependencies], but the workspace version is $version"
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" > /dev/null; then
            echo "::error file=Cargo.toml::v$version is already released. Bump version in the root Cargo.toml and the chx-core pin with it."
            exit 1
          fi


  lint-and-test:
    name: Lint and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry + build
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      # Hermetic: no Docker, no network.
      - name: Run unit tests
        run: cargo test --workspace

  integration:
    name: Integration tests (ClickHouse)
    runs-on: ubuntu-latest
    # Pulling the ClickHouse image is most of the time. The tests themselves
    # take seconds.
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry + build
        uses: Swatinem/rust-cache@v2

      # The tests bring up docker/compose.yaml themselves: a single server and
      # a two-node cluster with Keeper.
      - name: Run integration tests
        run: cargo test -p chx-core -- --ignored

      - name: ClickHouse logs
        if: failure()
        run: docker compose -f docker/compose.yaml logs --no-color --tail 200
